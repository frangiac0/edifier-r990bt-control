name: Build Windows executables

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        shell: pwsh
        env:
          PYTHON: python
        run: ./packaging/build.ps1

      # Manual runs also refresh the README screenshots (simulated speaker)
      # and commit them to the branch that was built.
      - name: Screenshots
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        shell: pwsh
        run: |
          python tools/screenshots.py assets
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/main-window.png assets/settings.png
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Update screenshots"
            git push origin "HEAD:${{ github.ref_name }}"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: edifier-r990bt-control-windows
          path: |
            dist/EdifierR990BT.exe
            dist/edifier-cli.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/EdifierR990BT.exe
            dist/edifier-cli.exe
