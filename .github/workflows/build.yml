name: Build Windows executables

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        shell: pwsh
        env:
          PYTHON: python
        run: ./packaging/build.ps1

      # Manual runs also capture the README screenshots with a simulated speaker.
      - name: Screenshots
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        shell: pwsh
        run: |
          python tools/screenshots.py screenshots
          # Also print them (palette PNG, base64) so they can be recovered from the log.
          python -c "import base64,io,pathlib;from PIL import Image;[print('==',p.name,'==',flush=True) or [print(l) for l in base64.encodebytes((lambda b:(Image.open(p).convert('RGB').quantize(256).save(b,'PNG',optimize=True),b.getvalue())[1])(io.BytesIO())).decode().split()] for p in sorted(pathlib.Path('screenshots').glob('*.png'))];print('== end ==')"

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        with:
          name: screenshots
          path: screenshots/

      - uses: actions/upload-artifact@v4
        with:
          name: edifier-r990bt-control-windows
          path: |
            dist/EdifierR990BT.exe
            dist/edifier-cli.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/EdifierR990BT.exe
            dist/edifier-cli.exe
