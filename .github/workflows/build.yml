name: Build Windows executables

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        shell: pwsh
        env:
          PYTHON: python
        run: ./packaging/build.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: edifier-r990bt-control-windows
          path: |
            dist/EdifierR990BT.exe
            dist/edifier-cli.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/EdifierR990BT.exe
            dist/edifier-cli.exe
