<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f7f9">
<title>Edifier R990BT</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root { --bg:#f6f7f9; --fg:#1d2129; --muted:#6b7280; --chip:#e5e7eb; --chip-on:#1f6feb; --card:#fff; --line:#d1d5db; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111418; --fg:#e8eaed; --muted:#9aa1ab; --chip:#252a31; --chip-on:#2f7bf5; --card:#1a1e24; --line:#353b44; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width:460px; margin:0 auto; padding:20px 16px calc(28px + env(safe-area-inset-bottom)); }
  h1 { font-size:22px; margin:0; }
  #status { color:var(--muted); font-size:14px; margin:4px 0 18px; min-height:20px; }
  h2 { font-size:12px; letter-spacing:.06em; color:var(--muted); margin:22px 0 8px; font-weight:600; }
  .row { display:flex; gap:8px; }
  .row > * { flex:1; }
  button { font:inherit; border:0; border-radius:10px; padding:14px 8px; background:var(--chip); color:var(--fg); cursor:pointer; touch-action:manipulation; }
  button.on { background:var(--chip-on); color:#fff; }
  button:disabled { opacity:.45; cursor:default; }
  button.primary { background:var(--chip-on); color:#fff; font-weight:600; }
  #connect { width:100%; }
  button.small { padding:8px 12px; font-size:14px; flex:0 0 auto; }
  button.quiet { background:transparent; border:1px solid var(--line); }
  .vol { display:flex; align-items:center; gap:10px; }
  .vol input { flex:1; accent-color:var(--chip-on); height:32px; }
  .vol output { min-width:52px; text-align:right; color:var(--muted); font-variant-numeric:tabular-nums; }
  .vol button { flex:0 0 48px; padding:10px 0; font-size:20px; }
  .head { display:flex; justify-content:space-between; align-items:center; }
  .head h2 { margin:22px 0 8px; }
  .scenes { display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; }
  .hint { color:var(--muted); font-size:14px; margin:6px 0 0; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; margin-top:8px; }
  .card label { display:block; font-size:13px; color:var(--muted); margin:10px 0 4px; }
  .card input, .card select { width:100%; font:inherit; padding:10px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--fg); }
  .actions { margin-top:26px; }
  #unsupported { display:none; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; margin-top:12px; }
  .bands { display:flex; gap:6px; }
  .bands .band { flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; }
  .bands input[type=range] { writing-mode:vertical-lr; direction:rtl; width:28px; height:100px; accent-color:var(--chip-on); }
  .bands .band small { color:var(--muted); font-size:11px; }
  #nowplaying { margin:-6px 0 10px; min-height:16px; }
  footer { margin-top:28px; color:var(--muted); font-size:12px; text-align:center; }
  footer a { color:inherit; }
</style>
</head>
<body>
<main>
  <h1>Edifier R990BT</h1>
  <div id="status"></div>
  <div id="nowplaying" class="hint"></div>

  <button id="connect" class="primary"></button>
  <div id="unsupported"></div>

  <div id="controls">
    <h2 id="l-input"></h2>
    <div class="row" id="sources"></div>

    <h2 id="l-volume"></h2>
    <div class="vol">
      <button id="vdown" aria-label="-">−</button>
      <input id="volume" type="range" min="0" max="16" step="1" value="0">
      <button id="vup" aria-label="+">+</button>
      <output id="vout">-</output>
    </div>

    <h2 id="l-eq"></h2>
    <div class="row" id="presets"></div>
    <div class="card" id="eq-custom" hidden>
      <label id="l-eq-profile"></label>
      <select id="eq-profile"></select>
      <div class="bands" id="bands"></div>
      <div class="row" style="margin-top:12px">
        <button id="eq-save" class="small quiet"></button>
        <button id="eq-del" class="small quiet"></button>
      </div>
    </div>

    <div class="head"><h2 id="l-scenes"></h2><button id="edit-scenes" class="small quiet"></button></div>
    <div class="scenes" id="scenes"></div>
    <p class="hint" id="scenes-empty"></p>
    <div class="card" id="editor" hidden>
      <label for="scene-pick" id="l-scene-pick"></label>
      <select id="scene-pick"></select>
      <label for="scene-name" id="l-scene-name"></label>
      <input id="scene-name" maxlength="24">
      <label for="scene-source" id="l-scene-source"></label>
      <select id="scene-source"></select>
      <label for="scene-eq" id="l-scene-eq"></label>
      <select id="scene-eq"></select>
      <div class="row" style="margin-top:14px">
        <button id="scene-new" class="small quiet"></button>
        <button id="scene-del" class="small quiet"></button>
        <button id="scene-done" class="small"></button>
      </div>
    </div>

    <div class="row actions">
      <button id="pair" class="quiet"></button>
      <button id="off" class="quiet"></button>
    </div>
  </div>

  <footer><span id="foot"></span> · <a href="https://github.com/frangiac0/edifier-r990bt-control">GitHub</a></footer>
</main>

<script>
"use strict";

// ---- Texts ----
const T = {
  en: {
    connect: "Connect to the speaker", reconnect: "Reconnect", disconnect: "Disconnect",
    input: "INPUT", volume: "VOLUME", eq: "EQUALIZER", scenes: "SCENES", edit: "Edit", done: "Done",
    custom: "Custom", profile: "Profile", save: "Save as...", nameP: "Profile name:", nowPlaying: "Now playing: {track}",
    music: "Music", movie: "Movie", game: "Game",
    scenesEmpty: "No scenes yet. Use Edit to save an input and EQ combination.",
    scene: "Scene", name: "Name", sceneInput: "Input", sceneEq: "EQ", newScene: "New", del: "Delete",
    sceneN: "Scene {n}",
    pair: "Pair new device", off: "Turn off",
    pairConfirm: "Disconnect the current Bluetooth audio device and put the speaker in pairing mode?\n\nThe control connection drops for a minute or two.",
    offConfirm: "Turn the speaker off?\n\nIt can only be turned back on with its knob.",
    idle: "Not connected. Close ConneX and the PC app first: the speaker accepts one control connection at a time.",
    searching: "Choose \"EDIFIER BLE\" in the list...", connecting: "Connecting...", connected: "Connected",
    lost: "Connection lost.", failed: "Could not connect: {e}", noService: "This device doesn't expose the Edifier control service.",
    pairing: "Pairing mode. Connect the new device to \"EDIFIER R990BT\".", poweredOff: "Speaker off. Turn it on with the knob.",
    unsupported: "This browser can't use Bluetooth. Use Chrome on Android, or the Bluefy browser on iPhone. On a PC, use the desktop app.",
    foot: "Unofficial. Works directly with the speaker over Bluetooth, no PC needed.",
  },
  es: {
    connect: "Conectar con el parlante", reconnect: "Reconectar", disconnect: "Desconectar",
    input: "ENTRADA", volume: "VOLUMEN", eq: "ECUALIZADOR", scenes: "ESCENAS", edit: "Editar", done: "Listo",
    custom: "Personalizado", profile: "Perfil", save: "Guardar como...", nameP: "Nombre del perfil:", nowPlaying: "Suena: {track}",
    music: "Música", movie: "Película", game: "Juegos",
    scenesEmpty: "Todavía no hay escenas. Usá Editar para guardar una combinación de entrada y EQ.",
    scene: "Escena", name: "Nombre", sceneInput: "Entrada", sceneEq: "EQ", newScene: "Nueva", del: "Eliminar",
    sceneN: "Escena {n}",
    pair: "Emparejar dispositivo", off: "Apagar",
    pairConfirm: "¿Desconectar el dispositivo de audio actual y poner el parlante en modo emparejamiento?\n\nEl control se corta por uno o dos minutos.",
    offConfirm: "¿Apagar el parlante?\n\nSolo se puede volver a prender con la perilla.",
    idle: "Sin conexión. Cerrá antes ConneX y la app de la PC: el parlante acepta una sola conexión de control a la vez.",
    searching: "Elegí \"EDIFIER BLE\" en la lista...", connecting: "Conectando...", connected: "Conectado",
    lost: "Se perdió la conexión.", failed: "No se pudo conectar: {e}", noService: "Este dispositivo no tiene el servicio de control de Edifier.",
    pairing: "Modo emparejamiento. Conectá el nuevo dispositivo a \"EDIFIER R990BT\".", poweredOff: "Parlante apagado. Prendelo con la perilla.",
    unsupported: "Este navegador no puede usar Bluetooth. Usá Chrome en Android, o el navegador Bluefy en iPhone. En la PC, usá la app de escritorio.",
    foot: "No oficial. Se conecta directo al parlante por Bluetooth, sin PC.",
  },
};
const L = T[(navigator.language || "en").toLowerCase().startsWith("es") ? "es" : "en"];
document.documentElement.lang = L === T.es ? "es" : "en";
const t = (k, v = {}) => L[k].replace(/\{(\w+)\}/g, (_, n) => v[n]);

// ---- Protocol (see docs/PROTOCOL.md) ----
const ADVERTISED = "0000d300-0000-1000-8000-00805f9b34fb";
const SERVICE = "4809d301-1a48-11e9-ab14-d663bd873d93";
const NOTIFY = "48090001-1a48-11e9-ab14-d663bd873d93";
const WRITE = "48090002-1a48-11e9-ab14-d663bd873d93";
const OP = { SRC_GET: 0x61, SRC_SET: 0x62, VOL_GET: 0x66, VOL_SET: 0x67, EQ_GET: 0xD5, EQ_SET: 0xC4,
  OFF: 0xCE, PAIR: 0xCD, CUSTOM_SET: 0x44, SONG: 0x01, SINGER: 0x02 };
const EQ_BANDS = [60, 150, 400, 1000, 4000, 12000];
const GAIN_LIMIT = 6;
const DEFAULT_PROFILES = {
  Flat: [0, 0, 0, 0, 0, 0], Rock: [2, 1, -1, 0, 1, 2], Pop: [1, 1, 0, 1, 1, 0],
  Instrumental: [1, 0, 1, 1, 2, 1], Vocal: [-1, 0, 2, 2, 1, 0],
  "Bass boost": [2, 2, 0, 0, 0, 0], "Treble boost": [0, 0, 0, 1, 2, 2],
};
const SOURCE_GROUP = 0x06;
const SOURCES = [[1, "Bluetooth"], [2, "Line 1"], [3, "Line 2"]];
const PRESETS = [[0, "music"], [2, "movie"], [1, "game"]];
const VOLUME_MAX = 16;

function frame(op, payload = []) {
  const body = [0xAA, 0xEC, op, (payload.length >> 8) & 0xFF, payload.length & 0xFF, ...payload];
  return new Uint8Array([...body, body.reduce((a, b) => a + b, 0) & 0xFF]);
}

let buf = [];
function parse(bytes) {
  buf.push(...bytes);
  const out = [];
  for (;;) {
    while (buf.length >= 2 && !([0xBB, 0xCC, 0xAA].includes(buf[0]) && [0xEC, 0xED].includes(buf[1]))) buf.shift();
    if (buf.length < 6) return out;
    const total = 5 + ((buf[3] << 8) | buf[4]) + 1;
    if (buf.length < total) return out;
    const raw = buf.slice(0, total);
    if ((raw.slice(0, -1).reduce((a, b) => a + b, 0) & 0xFF) !== raw[total - 1]) { buf.shift(); continue; }
    buf = buf.slice(total);
    out.push({ header: raw[0], op: raw[2], payload: raw.slice(5, -1) });
  }
}

// ---- BLE link ----
let device = null, writeChar = null, waiters = [], chain = Promise.resolve(), pollTimer = null;
const state = { connected: false, source: null, volume: null, eq: null,
  eqMode: "preset", customGains: [0, 0, 0, 0, 0, 0], title: null, artist: null };

function onNotify(e) {
  const v = e.target.value;
  for (const f of parse(new Uint8Array(v.buffer, v.byteOffset, v.byteLength))) {
    if (f.header === 0xAA) continue;
    if (f.op === OP.SONG) state.title = decodeText(f.payload) || null;
    else if (f.op === OP.SINGER) state.artist = decodeText(f.payload) || null;
    if (f.op === OP.SONG || f.op === OP.SINGER) renderNowPlaying();
    waiters = waiters.filter((w) => (w.op === f.op ? (w.resolve(f), false) : true));
  }
}

function decodeText(bytes) {
  try { return new TextDecoder("utf-8").decode(new Uint8Array(bytes)).trim(); } catch { return ""; }
}
function renderNowPlaying() {
  const txt = [state.title, state.artist].filter(Boolean).join(" - ");
  $("nowplaying").textContent = state.connected && txt ? t("nowPlaying", { track: txt }) : "";
}

async function send(bytes) {
  for (let i = 0; i < bytes.length; i += 20) {
    const part = bytes.slice(i, i + 20);
    if (writeChar.properties.write) await writeChar.writeValueWithResponse(part);
    else await writeChar.writeValueWithoutResponse(part);
  }
}

// Requests are serialized: the speaker answers one at a time.
function request(op, payload = [], expectReply = true) {
  const run = async () => {
    if (!writeChar) return null;
    if (!expectReply) { await send(frame(op, payload)); return null; }
    const reply = new Promise((resolve) => {
      const w = { op, resolve };
      waiters.push(w);
      setTimeout(() => { waiters = waiters.filter((x) => x !== w); resolve(null); }, 3000);
    });
    await send(frame(op, payload));
    return reply;
  };
  const p = chain.then(run, run);
  chain = p.catch(() => null);
  return p;
}

async function refresh() {
  const s = await request(OP.SRC_GET);
  if (s && s.payload.length >= 2) state.source = s.payload[1];
  const v = await request(OP.VOL_GET);
  if (v && v.payload.length >= 2) state.volume = v.payload[1];
  const q = await request(OP.EQ_GET);
  if (q && q.payload.length >= 1) state.eq = q.payload[0];
  render();
}

async function openGatt(dev) {
  setStatus(t("connecting"));
  if (device && device !== dev) device.removeEventListener("gattserverdisconnected", onDisconnected);
  device = dev;
  device.addEventListener("gattserverdisconnected", onDisconnected);
  const server = await device.gatt.connect();
  let service;
  try { service = await server.getPrimaryService(SERVICE); } catch { throw new Error(t("noService")); }
  writeChar = await service.getCharacteristic(WRITE);
  const notify = await service.getCharacteristic(NOTIFY);
  notify.addEventListener("characteristicvaluechanged", onNotify);
  await notify.startNotifications();
  buf = [];
  state.connected = true;
  setStatus(t("connected") + (device.name ? ` · ${device.name}` : ""));
  await refresh();
  clearInterval(pollTimer);
  pollTimer = setInterval(() => { if (state.connected && !document.hidden) refresh(); }, 5000);
}

async function connect() {
  if (state.connected) { device.gatt.disconnect(); return; }
  try {
    // Reuse a speaker this site was already allowed to use, when the browser supports it.
    if (device) return await openGatt(device);
    if (navigator.bluetooth.getDevices) {
      const known = (await navigator.bluetooth.getDevices())[0];
      if (known) return await openGatt(known);
    }
    setStatus(t("searching"));
    const dev = await navigator.bluetooth.requestDevice({
      filters: [{ services: [ADVERTISED] }, { namePrefix: "EDIFIER" }],
      optionalServices: [SERVICE],
    });
    await openGatt(dev);
  } catch (e) {
    state.connected = false;
    writeChar = null;
    if (e && e.name === "NotFoundError") setStatus(t("idle"));  // picker cancelled
    else setStatus(t("failed", { e: (e && e.message) || e }));
    render();
  }
}

let quietDisconnect = null;
function onDisconnected() {
  state.connected = false;
  state.title = null; state.artist = null;
  writeChar = null;
  clearInterval(pollTimer);
  setStatus(quietDisconnect || t("lost"));
  quietDisconnect = null;
  render();
}

// ---- Scenes (stored on this phone) ----
const loadScenes = () => { try { return JSON.parse(localStorage.getItem("scenes") || "[]"); } catch { return []; } };
const saveScenes = (s) => { try { localStorage.setItem("scenes", JSON.stringify(s)); } catch {} };
let scenes = loadScenes();

async function applyScene(s) {
  await request(OP.SRC_SET, [SOURCE_GROUP, s.source]);
  await request(OP.EQ_SET, [s.eq]);
  state.source = s.source; state.eq = s.eq;
  render();
}

// ---- UI ----
const $ = (id) => document.getElementById(id);
const setStatus = (text) => { $("status").textContent = text; };

function buttons(container, items, onClick) {
  return items.map(([code, label]) => {
    const b = document.createElement("button");
    b.textContent = label;
    b.dataset.code = code;
    b.onclick = () => onClick(code);
    $(container).appendChild(b);
    return b;
  });
}

const srcButtons = buttons("sources", SOURCES, async (c) => {
  state.source = c; render();
  await request(OP.SRC_SET, [SOURCE_GROUP, c]);
});
const eqButtons = buttons("presets", PRESETS.map(([c, k]) => [c, t(k)]), async (c) => {
  state.eqMode = "preset"; state.eq = c; render();
  await request(OP.EQ_SET, [c]);
});

// Custom EQ button (reuses the chip style) + panel.
const customBtn = document.createElement("button");
customBtn.textContent = t("custom");
customBtn.onclick = () => enterCustom();
$("presets").appendChild(customBtn);

const loadProfiles = () => {
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem("eqProfiles") || "{}"); } catch {}
  return { ...DEFAULT_PROFILES, ...saved };
};
const clampGains = (g) => EQ_BANDS.map((_, i) => Math.max(-GAIN_LIMIT, Math.min(GAIN_LIMIT, Math.round(g[i] || 0))));

const bandInputs = EQ_BANDS.map((hz) => {
  const wrap = document.createElement("div"); wrap.className = "band";
  const r = document.createElement("input");
  r.type = "range"; r.min = -GAIN_LIMIT; r.max = GAIN_LIMIT; r.step = 1; r.value = 0;
  r.oninput = () => applyBands();
  const lab = document.createElement("small");
  lab.textContent = hz >= 1000 ? hz / 1000 + "k" : hz;
  wrap.append(r, lab); $("bands").appendChild(wrap);
  return r;
});

const profileSel = $("eq-profile");
function reloadProfiles(select) {
  const p = loadProfiles();
  profileSel.innerHTML = "";
  Object.keys(p).forEach((n) => profileSel.add(new Option(n, n)));
  if (select && p[select]) profileSel.value = select;
  return p;
}
profileSel.onchange = () => {
  const p = loadProfiles()[profileSel.value];
  if (p) { setBands(p); applyBands(profileSel.value); }
};
const setBands = (g) => bandInputs.forEach((r, i) => (r.value = g[i]));
const currentBands = () => clampGains(bandInputs.map((r) => +r.value));

async function sendCustom(gains) {
  for (let b = 0; b < EQ_BANDS.length; b++) {
    const hz = EQ_BANDS[b], g = gains[b] & 0xFF;
    await request(OP.CUSTOM_SET, [b, (hz >> 8) & 0xFF, hz & 0xFF, g], false);
  }
}
async function applyBands(name) {
  state.eqMode = "custom"; state.customGains = currentBands(); render();
  await sendCustom(state.customGains);
  try { localStorage.setItem("eqLast", JSON.stringify({ gains: state.customGains, name: name || null })); } catch {}
}
function enterCustom() {
  reloadProfiles();
  const g = state.customGains.some(Boolean) ? state.customGains : (loadProfiles().Flat || [0,0,0,0,0,0]);
  setBands(g); applyBands();
}
$("eq-save").onclick = () => {
  const name = prompt(t("nameP"));
  if (!name) return;
  const saved = (() => { try { return JSON.parse(localStorage.getItem("eqProfiles") || "{}"); } catch { return {}; } })();
  saved[name.trim()] = currentBands();
  try { localStorage.setItem("eqProfiles", JSON.stringify(saved)); } catch {}
  reloadProfiles(name.trim());
};
$("eq-del").onclick = () => {
  const name = profileSel.value;
  if (!name || name in DEFAULT_PROFILES) return;
  const saved = (() => { try { return JSON.parse(localStorage.getItem("eqProfiles") || "{}"); } catch { return {}; } })();
  delete saved[name];
  try { localStorage.setItem("eqProfiles", JSON.stringify(saved)); } catch {}
  reloadProfiles();
};

const vol = $("volume");
let dragging = false;
vol.max = VOLUME_MAX;
vol.addEventListener("input", () => { dragging = true; $("vout").textContent = `${vol.value} / ${VOLUME_MAX}`; });
vol.addEventListener("change", () => { dragging = false; setVolume(+vol.value); });
$("vdown").onclick = () => setVolume((state.volume ?? 0) - 1);
$("vup").onclick = () => setVolume((state.volume ?? 0) + 1);
async function setVolume(v) {
  v = Math.max(0, Math.min(VOLUME_MAX, v));
  state.volume = v; render();
  await request(OP.VOL_SET, [v]);
}

$("pair").onclick = async () => {
  if (!confirm(t("pairConfirm"))) return;
  quietDisconnect = t("pairing");
  await request(OP.PAIR, [], false);
};
$("off").onclick = async () => {
  if (!confirm(t("offConfirm"))) return;
  quietDisconnect = t("poweredOff");
  await request(OP.OFF, [], false);
};

function renderScenes() {
  const box = $("scenes");
  box.textContent = "";
  scenes.forEach((s) => {
    const b = document.createElement("button");
    b.textContent = s.name;
    b.disabled = !state.connected;
    b.onclick = () => applyScene(s);
    box.appendChild(b);
  });
  $("scenes-empty").textContent = scenes.length ? "" : t("scenesEmpty");
}

// Scene editor
const pick = $("scene-pick"), nameIn = $("scene-name"), srcSel = $("scene-source"), eqSel = $("scene-eq");
SOURCES.forEach(([c, l]) => srcSel.add(new Option(l, c)));
PRESETS.forEach(([c, k]) => eqSel.add(new Option(t(k), c)));
function fillEditor(index) {
  pick.textContent = "";
  scenes.forEach((s, i) => pick.add(new Option(s.name, i)));
  const has = scenes.length > 0;
  [pick, nameIn, srcSel, eqSel, $("scene-del")].forEach((el) => (el.disabled = !has));
  if (!has) { nameIn.value = ""; return; }
  index = Math.min(Math.max(index, 0), scenes.length - 1);
  pick.value = index;
  nameIn.value = scenes[index].name;
  srcSel.value = scenes[index].source;
  eqSel.value = scenes[index].eq;
}
function editCurrent() {
  const i = +pick.value;
  if (!scenes[i]) return;
  scenes[i] = { name: nameIn.value.trim().slice(0, 24) || "?", source: +srcSel.value, eq: +eqSel.value };
  pick.options[i].text = scenes[i].name;
  saveScenes(scenes); renderScenes();
}
pick.onchange = () => fillEditor(+pick.value);
nameIn.oninput = editCurrent; srcSel.onchange = editCurrent; eqSel.onchange = editCurrent;
$("scene-new").onclick = () => {
  scenes.push({ name: t("sceneN", { n: scenes.length + 1 }), source: state.source ?? 1, eq: state.eq ?? 0 });
  saveScenes(scenes); renderScenes(); fillEditor(scenes.length - 1); nameIn.select();
};
$("scene-del").onclick = () => {
  scenes.splice(+pick.value, 1);
  saveScenes(scenes); renderScenes(); fillEditor(+pick.value);
};
$("edit-scenes").onclick = () => { $("editor").hidden = false; $("edit-scenes").hidden = true; fillEditor(0); };
$("scene-done").onclick = () => { $("editor").hidden = true; $("edit-scenes").hidden = false; };

function render() {
  const on = state.connected;
  $("connect").textContent = on ? t("disconnect") : device ? t("reconnect") : t("connect");
  $("connect").classList.toggle("quiet", on);
  $("connect").classList.toggle("primary", !on);
  srcButtons.forEach((b) => { b.disabled = !on; b.classList.toggle("on", on && +b.dataset.code === state.source); });
  eqButtons.forEach((b) => { b.disabled = !on; b.classList.toggle("on", on && state.eqMode === "preset" && +b.dataset.code === state.eq); });
  customBtn.disabled = !on;
  customBtn.classList.toggle("on", on && state.eqMode === "custom");
  $("eq-custom").hidden = !(on && state.eqMode === "custom");
  [vol, $("vdown"), $("vup"), $("pair"), $("off")].forEach((el) => (el.disabled = !on));
  renderNowPlaying();
  if (!dragging) vol.value = state.volume ?? 0;
  $("vout").textContent = on && state.volume != null ? `${state.volume} / ${VOLUME_MAX}` : "-";
  renderScenes();
}

// Static texts
const texts = {
  "l-input": "input", "l-volume": "volume", "l-eq": "eq", "l-scenes": "scenes", "edit-scenes": "edit",
  "l-eq-profile": "profile", "eq-save": "save", "eq-del": "del",
  "l-scene-pick": "scene", "l-scene-name": "name", "l-scene-source": "sceneInput", "l-scene-eq": "sceneEq",
  "scene-new": "newScene", "scene-del": "del", "scene-done": "done", pair: "pair", off: "off", foot: "foot",
};
Object.entries(texts).forEach(([id, k]) => ($(id).textContent = t(k)));

if (!navigator.bluetooth) {
  $("connect").hidden = true;
  $("unsupported").style.display = "block";
  $("unsupported").textContent = t("unsupported");
} else {
  $("connect").onclick = connect;
  setStatus(t("idle"));
}
document.addEventListener("visibilitychange", () => { if (!document.hidden && state.connected) refresh(); });
render();

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
